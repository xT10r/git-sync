name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  test:
    uses: ./.github/workflows/common.yml
  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.2'
          cache: true
      - name: Build supported publication platforms
        run: |
          mkdir -p build
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags='-s -w' -o build/git-sync ./cmd/
            tar -czf "build/git-sync-linux-${arch}.tar.gz" -C build git-sync
          done
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o build/git-sync ./cmd/
          tar -czf build/git-sync-darwin-arm64.tar.gz -C build git-sync
          rm build/git-sync
          cd build
          sha256sum *.tar.gz > SHA256SUMS
      - name: Publish release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" build/*.tar.gz build/SHA256SUMS --generate-notes --verify-tag
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            xt10r/git-sync:latest
            xt10r/git-sync:${{ github.ref_name }}
