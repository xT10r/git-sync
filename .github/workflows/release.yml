name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/common.yml

  release:
    name: Create Release
    needs: test
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          check-latest: true

      - name: Compute version vars
        id: vars
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "COMMIT=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          echo "DIRTY=false" >> $GITHUB_OUTPUT

      - name: Build artifacts (linux/darwin amd64+arm64, windows amd64)
        shell: bash
        run: |
          set -euo pipefail
          ver='${{ steps.vars.outputs.VERSION }}'
          commit='${{ steps.vars.outputs.COMMIT }}'
          date='${{ steps.vars.outputs.DATE }}'
          dirty='${{ steps.vars.outputs.DIRTY }}'

          build() {
            os="$1"; arch="$2"; ext="$3"
            outdir="build/${os}/${arch}"
            mkdir -p "$outdir"
            GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w \
                -X 'git-sync/internal/version.Version=${ver}' \
                -X 'git-sync/internal/version.Commit=${commit}' \
                -X 'git-sync/internal/version.Date=${date}' \
                -X 'git-sync/internal/version.Dirty=${dirty}'" \
              -o "${outdir}/git-sync${ext}" ./cmd

            # упаковка
            case "$os" in
              windows)
                zip -j "build/git-sync_${ver}_${os}_${arch}.zip" "${outdir}/git-sync${ext}"
                ;;
              linux|darwin)
                tar -czf "build/git-sync_${ver}_${os}_${arch}.tar.gz" -C "$outdir" "git-sync${ext}"
                ;;
            esac
          }

          build linux  amd64 ""
          build linux  arm64 ""
          build darwin amd64 ""
          build darwin arm64 ""
          build windows amd64 ".exe"
          # build windows arm64 ".exe" # без излишеств

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign release artifacts (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          shopt -s nullglob
          for f in build/git-sync_*; do
            cosign sign-blob --yes "$f" \
              --output-signature "$f.sig" \
              --output-certificate "$f.pem"
          done

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION='${{ steps.vars.outputs.VERSION }}'
          awk '/## \['"$VERSION"'\]/,/^## \[/' CHANGELOG.md | sed '$d' > release_notes.md || true
          if [ ! -s release_notes.md ]; then
            awk '/## \['"$VERSION"'\]/,/^$/' CHANGELOG.md > release_notes.md || true
          fi
          if [ ! -s release_notes.md ]; then
            echo "Release ${VERSION}" > release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            build/git-sync_${{ steps.vars.outputs.VERSION }}_linux_amd64.tar.gz
            build/git-sync_${{ steps.vars.outputs.VERSION }}_linux_arm64.tar.gz
            build/git-sync_${{ steps.vars.outputs.VERSION }}_darwin_amd64.tar.gz
            build/git-sync_${{ steps.vars.outputs.VERSION }}_darwin_arm64.tar.gz
            build/git-sync_${{ steps.vars.outputs.VERSION }}_windows_amd64.zip
            build/git-sync_${{ steps.vars.outputs.VERSION }}_linux_amd64.tar.gz.sig
            build/git-sync_${{ steps.vars.outputs.VERSION }}_linux_amd64.tar.gz.pem
            build/git-sync_${{ steps.vars.outputs.VERSION }}_linux_arm64.tar.gz.sig
            build/git-sync_${{ steps.vars.outputs.VERSION }}_linux_arm64.tar.gz.pem
            build/git-sync_${{ steps.vars.outputs.VERSION }}_darwin_amd64.tar.gz.sig
            build/git-sync_${{ steps.vars.outputs.VERSION }}_darwin_amd64.tar.gz.pem
            build/git-sync_${{ steps.vars.outputs.VERSION }}_darwin_arm64.tar.gz.sig
            build/git-sync_${{ steps.vars.outputs.VERSION }}_darwin_arm64.tar.gz.pem
            build/git-sync_${{ steps.vars.outputs.VERSION }}_windows_amd64.zip.sig
            build/git-sync_${{ steps.vars.outputs.VERSION }}_windows_amd64.zip.pem
