name: Common checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.26.9', '1.27.2']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race -count=2 -coverprofile=coverage.out ./...
      - name: Scan reachable vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -o build/git-sync ./cmd/
      - name: Cross-compile
        run: |
          GOOS=darwin GOARCH=arm64 go build -o build/git-sync-darwin-arm64 ./cmd/
          GOOS=windows GOARCH=amd64 go build -o build/git-sync-windows-amd64.exe ./cmd/
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-go-${{ matrix.go }}
          path: coverage.out
