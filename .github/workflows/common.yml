name: Common Actions

on:
  workflow_call:
    inputs:
      allow_fail:
        type: boolean
        default: true
      skip_lint:
        type: boolean
        default: false
      skip_tests:
        type: boolean
        default: false

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          check-latest: true

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Install dependencies
        run: go mod download

      # Решаем «строгость»: PR — строгий по новым проблемам; main/tag — мягкий (не валим билд)
      - name: Decide strictness
        id: strict
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            STRICT_LINT=true
            CONTINUE_ON_ERROR=false
          elif [[ "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_REF}" == refs/tags/* ]]; then
            STRICT_LINT=false
            CONTINUE_ON_ERROR=true
          else
            STRICT_LINT=false
            CONTINUE_ON_ERROR=${{ inputs.allow_fail && 'true' || 'false' }}
          fi
          echo "STRICT_LINT=$STRICT_LINT" >> $GITHUB_OUTPUT
          echo "CONTINUE_ON_ERROR=$CONTINUE_ON_ERROR" >> $GITHUB_OUTPUT

      - name: golangci-lint
        if: inputs.skip_lint != true
        uses: golangci/golangci-lint-action@v6
        with:
          args: --timeout=5m
          # На PR — проверяем только новые проблемы
          only-new-issues: ${{ steps.strict.outputs.STRICT_LINT == 'true' && github.event_name == 'pull_request' }}
        continue-on-error: ${{ inputs.allow_fail || steps.strict.outputs.CONTINUE_ON_ERROR == 'true' }}

      - name: Run tests
        if: inputs.skip_tests != true
        run: go test -cover ./...
        continue-on-error: ${{ inputs.allow_fail || steps.strict.outputs.CONTINUE_ON_ERROR == 'true' }}
