name: build-and-push

on:
  push:
    tags: ['v*']           # release
    branches: ['main']     # edge/latest
  workflow_dispatch:
    inputs:
      use_latest_tag:
        description: 'Build images for latest release tag'
        type: boolean
        default: false
      local_build:
        description: 'Local build: do not push, load image into local Docker, single-arch amd64'
        type: boolean
        default: false
      skip_supply_chain:
        description: 'Skip SBOM/Trivy/SLSA steps'
        type: boolean
        default: false
      skip_signing:
        description: 'Skip cosign signing steps'
        type: boolean
        default: false
  schedule:
    - cron: '17 3 * * *'   # every day at 03:17 UTC

permissions:
  contents: read
  packages: write
  id-token: write          # for keyless cosign

jobs:

  precheck:
    uses: ./.github/workflows/common.yml
    with:
      allow_fail: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.local_build == 'true' }} # for local builds
      skip_lint:  ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.local_build == 'true' }} # for local builds

  docker:
    name: Build & Push Container
    needs: precheck
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        family: [alpine, debian, ubuntu]
        include:
          - family: alpine
            image: alpine:3.21
            suffix: alpine
          - family: debian
            image: debian:trixie-slim
            suffix: debian
          - family: ubuntu
            image: ubuntu:24.04
            suffix: ubuntu

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR login (skip for PR and local_build)
      - name: Login GHCR
        if: github.event_name != 'pull_request' && github.event.inputs.local_build != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub login (tags only; skip for local_build)
      - name: Login Docker Hub
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/') && github.event.inputs.local_build != 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Version: tag → vX.Y.Z, schedule/dispatch → last release, otherwise dev
      - name: Compute version vars
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ "${{ github.event.inputs.use_latest_tag }}" == "true" || "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            VERSION="$(git describe --tags --abbrev=0 --match 'v*' || echo dev)"
          else
            VERSION="dev"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "COMMIT=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          echo "DIRTY=false" >> $GITHUB_OUTPUT

          # Canonical tag (for signing/scan where applicable)
          if [[ "$VERSION" == dev ]]; then
            echo "CANONICAL_TAG=dev-${{ matrix.suffix }}" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            echo "CANONICAL_TAG=latest-${{ matrix.suffix }}" >> $GITHUB_OUTPUT
          else
            echo "CANONICAL_TAG=${VERSION}-${{ matrix.suffix }}" >> $GITHUB_OUTPUT
          fi

      # Metadata for push events (semver + suffixes) — not needed for local_build
      - name: Docker metadata (tags for push)
        id: meta
        if: github.event_name == 'push' && github.event.inputs.local_build != 'true'
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ startsWith(github.ref, 'refs/tags/') && 'docker.io/xt10r/git-sync' || '' }}
          tags: |
            type=semver,pattern={{version}},suffix=-${{ matrix.suffix }},enable={{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},suffix=-${{ matrix.suffix }},enable={{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}},suffix=-${{ matrix.suffix }},enable={{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,suffix=-${{ matrix.suffix }},enable={{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=git-sync

      # Tags for schedule/dispatch OR local_build — manual
      - name: Compute tags (for schedule/dispatch/local)
        id: tags
        if: github.event_name != 'push' || github.event.inputs.local_build == 'true'
        shell: bash
        run: |
          ver='${{ steps.ver.outputs.VERSION }}'
          suf='${{ matrix.suffix }}'
          if [[ "${{ github.event.inputs.local_build }}" == "true" ]]; then
            # local tag (loaded into local Docker)
            echo "TAGS=git-sync:local-${suf}" >> $GITHUB_OUTPUT
            echo "GHCR_TAG=git-sync:local-${suf}" >> $GITHUB_OUTPUT
          else
            if [[ "$ver" == "dev" ]]; then
              echo "TAGS=ghcr.io/${{ github.repository }}:dev-${suf}" >> $GITHUB_OUTPUT
            else
              major="${ver#v}"; major="${major%%.*}"
              minor="${ver#v${major}.}"; minor="${minor%%.*}"
              echo "TAGS=ghcr.io/${{ github.repository }}:${ver}-${suf},ghcr.io/${{ github.repository }}:v${major}.${minor}-${suf},ghcr.io/${{ github.repository }}:v${major}-${suf},ghcr.io/${{ github.repository }}:latest-${suf}" >> $GITHUB_OUTPUT
            fi
            echo "GHCR_TAG=ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.CANONICAL_TAG }}" >> $GITHUB_OUTPUT
          fi

      - name: Build & Push (multi-arch or local)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' && github.event.inputs.local_build != 'true' }}
          load: ${{ github.event.inputs.local_build == 'true' }}
          platforms: ${{ github.event.inputs.local_build == 'true' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          tags: ${{ (github.event_name == 'push' && github.event.inputs.local_build != 'true') && steps.meta.outputs.tags || steps.tags.outputs.TAGS }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.VERSION }}
            COMMIT=${{ steps.ver.outputs.COMMIT }}
            DATE=${{ steps.ver.outputs.DATE }}
            DIRTY=${{ steps.ver.outputs.DIRTY }}
            RUNTIME_IMAGE=${{ matrix.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0.17.5

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      # Immutable refs (only when pushing)
      - name: Compute immutable refs (by digest)
        id: img
        if: github.event.inputs.local_build != 'true'
        shell: bash
        run: |
          GHCR_DIGEST='${{ steps.build.outputs.digest }}'
          echo "GHCR_DIGEST=$GHCR_DIGEST" >> $GITHUB_OUTPUT
          echo "GHCR_REF=ghcr.io/${{ github.repository }}@${GHCR_DIGEST}" >> $GITHUB_OUTPUT

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/tags/* ]]; then
            DOCKER_TAG="docker.io/xt10r/git-sync:${{ steps.ver.outputs.CANONICAL_TAG }}"
            DOCKER_DIGEST=$(crane digest "$DOCKER_TAG")
            echo "DOCKER_DIGEST=$DOCKER_DIGEST" >> $GITHUB_OUTPUT
            echo "DOCKER_REF=docker.io/xt10r/git-sync@${DOCKER_DIGEST}" >> $GITHUB_OUTPUT
          fi

      # Validate OCI labels for local builds (no push)
      - name: Validate OCI labels (local)
        if: github.event.inputs.local_build == 'true'
        shell: bash
        env:
          EXPECTED_BASE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          IMG="git-sync:local-${{ matrix.suffix }}"
          # Получим только словарь лейблов
          docker image inspect "$IMG" --format '{{json .Config.Labels }}' > labels.json

          python3 - <<'PY'
          import json, os, re, sys
          with open('labels.json') as f:
              L = json.load(f) or {}
          req = [
              "org.opencontainers.image.title",
              "org.opencontainers.image.description",
              "org.opencontainers.image.url",
              "org.opencontainers.image.source",
              "org.opencontainers.image.version",
              "org.opencontainers.image.revision",
              "org.opencontainers.image.created",
              "org.opencontainers.image.licenses",
              "org.opencontainers.image.vendor",
              "org.opencontainers.image.base.name",
          ]
          errs=[]
          missing=[k for k in req if not L.get(k)]
          if missing: errs.append(f"missing/empty: {missing}")
          if L.get("org.opencontainers.image.title")!="git-sync":
              errs.append("title mismatch (expected 'git-sync')")
          if L.get("org.opencontainers.image.licenses")!="Apache-2.0":
              errs.append("licenses must be 'Apache-2.0'")
          if L.get("org.opencontainers.image.vendor")!="xt10r":
              errs.append("vendor must be 'xt10r'")
          exp_base=os.environ.get("EXPECTED_BASE","")
          if exp_base and L.get("org.opencontainers.image.base.name")!=exp_base:
              errs.append(f"base.name mismatch: {L.get('org.opencontainers.image.base.name')} != {exp_base}")
          rev=L.get("org.opencontainers.image.revision","")
          if not re.fullmatch(r"[0-9a-f]{7,40}", rev):
              errs.append("revision is not a git SHA (7..40 hex)")
          created=L.get("org.opencontainers.image.created","")
          if not re.match(r"\d{4}-\d{2}-\d{2}T", created):
              errs.append("created must look like RFC3339 timestamp")
          if errs:
              print("\n".join(errs)); sys.exit(1)
          print("Labels OK (local)")
          PY

      # Validate OCI labels for pushed images on GHCR (by digest)
      - name: Validate OCI labels (remote GHCR)
        if: github.event.inputs.local_build != 'true'
        shell: bash
        env:
          EXPECTED_BASE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          REF="${{ steps.img.outputs.GHCR_REF }}"
          # Забираем config из реестра и вытаскиваем секцию Labels
          crane config "$REF" > cfg.json

          python3 - <<'PY'
          import json, os, re, sys
          with open('cfg.json') as f:
              data=json.load(f)
          L=(data.get("config") or {}).get("Labels") or {}
          req = [
              "org.opencontainers.image.title",
              "org.opencontainers.image.description",
              "org.opencontainers.image.url",
              "org.opencontainers.image.source",
              "org.opencontainers.image.version",
              "org.opencontainers.image.revision",
              "org.opencontainers.image.created",
              "org.opencontainers.image.licenses",
              "org.opencontainers.image.vendor",
              "org.opencontainers.image.base.name",
          ]
          errs=[]
          missing=[k for k in req if not L.get(k)]
          if missing: errs.append(f"missing/empty: {missing}")
          if L.get("org.opencontainers.image.title")!="git-sync":
              errs.append("title mismatch (expected 'git-sync')")
          if L.get("org.opencontainers.image.licenses")!="Apache-2.0":
              errs.append("licenses must be 'Apache-2.0'")
          if L.get("org.opencontainers.image.vendor")!="xt10r":
              errs.append("vendor must be 'xt10r'")
          exp_base=os.environ.get("EXPECTED_BASE","")
          if exp_base and L.get("org.opencontainers.image.base.name")!=exp_base:
              errs.append(f"base.name mismatch: {L.get('org.opencontainers.image.base.name')} != {exp_base}")
          rev=L.get("org.opencontainers.image.revision","")
          if not re.fullmatch(r"[0-9a-f]{7,40}", rev):
              errs.append("revision is not a git SHA (7..40 hex)")
          created=L.get("org.opencontainers.image.created","")
          if not re.match(r"\d{4}-\d{2}-\d{2}T", created):
              errs.append("created must look like RFC3339 timestamp")
          if errs:
              print("\n".join(errs)); sys.exit(1)
          print("Labels OK (remote)")
          PY
          
      # Sign GHCR image
      - name: Cosign sign image (GHCR)
        if: github.event_name != 'pull_request' && github.event.inputs.local_build != 'true' && github.event.inputs.skip_signing != 'true'
        env: { COSIGN_EXPERIMENTAL: "1" }
        run: |
          cosign sign --yes "${{ steps.img.outputs.GHCR_REF }}"

      # Sign Docker Hub image (tags only)
      - name: Cosign sign image (Docker Hub)
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/') && github.event.inputs.local_build != 'true' && github.event.inputs.skip_signing != 'true'
        env: { COSIGN_EXPERIMENTAL: "1" }
        run: |
          cosign sign --yes "${{ steps.img.outputs.DOCKER_REF }}"

      # SBOM to GHCR
      - name: Generate SBOM (CycloneDX JSON)
        if: github.event.inputs.local_build != 'true' && github.event.inputs.skip_supply_chain != 'true'
        run: |
          syft packages "${{ steps.img.outputs.GHCR_REF }}" -o cyclonedx-json > sbom.cdx.json

      - name: Attach SBOM to image (GHCR)
        if: github.event.inputs.local_build != 'true' && github.event.inputs.skip_supply_chain != 'true'
        run: |
          cosign attach sbom --sbom sbom.cdx.json --type cyclonedx "${{ steps.img.outputs.GHCR_REF }}"

      - name: Sign SBOM artifact (GHCR)
        if: github.event.inputs.local_build != 'true' && github.event.inputs.skip_supply_chain != 'true' && github.event.inputs.skip_signing != 'true'
        env: { COSIGN_EXPERIMENTAL: "1" }
        run: |
          SBOM_REF=$(cosign triangulate --type sbom "${{ steps.img.outputs.GHCR_REF }}")
          cosign sign --yes "$SBOM_REF"

      # SLSA provenance (GHCR digest)
      - name: Attest build provenance
        if: github.event.inputs.local_build != 'true' && github.event.inputs.skip_supply_chain != 'true'
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.img.outputs.GHCR_DIGEST }}
          push-to-registry: true

      # Trivy scan (GHCR digest)
      - name: Trivy scan (image)
        if: github.event.inputs.local_build != 'true' && github.event.inputs.skip_supply_chain != 'true'
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.img.outputs.GHCR_DIGEST }}
          format: table
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
